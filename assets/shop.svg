<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="256"
    height="256"
    viewBox="0 0 256 256">

    <defs>

        <linearGradient
            id="storeGradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%">

            <stop offset="0%" stop-color="#2563EB"/>

            <stop offset="100%" stop-color="#1D4ED8"/>

        </linearGradient>

    </defs>

    <!-- Shopping Bag -->

    <rect
        x="48"
        y="64"
        width="160"
        height="150"
        rx="24"
        fill="url(#storeGradient)"/>

    <!-- Handles -->

    <path
        d="M82 82
           C82 45 174 45 174 82"
        stroke="#FFFFFF"
        stroke-width="12"
        fill="none"
        stroke-linecap="round"/>

    <!-- Letter S -->

    <text
        x="128"
        y="165"
        text-anchor="middle"
        font-size="82"
        font-family="Poppins, Arial, sans-serif"
        font-weight="700"
        fill="#FFFFFF">

        S

    </text>

</svg>