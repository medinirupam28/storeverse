<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoreVerse | Login</title>
</head>
<body bgcolor="#F4F8FC">
    <!-- Header -->
    <table width="100%" bgcolor="#1E3A8A" cellpadding="15">
        <tr>
            <td>
                <font color="white" size="6">
                    🛍 StoreVerse
                </font>
                <br>
                <font color="white">
                    One Platform. Unlimited Stores.
                </font>
            </td>
            <td align="right">
                <a href="index.html">Home</a>&nbsp;&nbsp;
                <a href="register.html">Register</a>
            </td>
        </tr>
    </table>
    <br><br><br>
    <center>
        <table bgcolor="white" cellpadding="25" width="420">
            <tr>
                <td>
                    <center>
                        <h2>Shop Owner Login</h2>
                        <p>
                            Login to access your own shop dashboard.
                        </p>
                    </center>
                    <hr>
                    <form action="#" method="post">
                        <label>
                            <b>Username</b>
                        </label>
                        <br><br>
                        <input
                            type="text"
                            name="username"
                            placeholder="Enter Username"
                            required
                            size="45">
                        <br><br>
                        <label>
                            <b>Password</b>
                        </label>
                        <br><br>
                        <input
                            type="password"
                            name="password"
                            placeholder="Enter Password"
                            required
                            minlength="6"
                            size="45">
                        <br><br>
                        <input
                            type="checkbox">
                        Remember Me
                        <br><br>
                        <center>
                            <input
                                type="submit"
                                value="Login">
                        </center>
                    </form>
                    <hr>
                    <center>
                        <p>
                            New to StoreVerse?
                        </p>
                        <a href="register.html">
                            Create Shop Account
                        </a>
                        <br><br>
                        <a href="#">
                            Forgot Password?
                        </a>
                    </center>
                </td>
            </tr>
        </table>
    </center>
    <br><br><br>
    <table width="100%" bgcolor="#1E3A8A" cellpadding="20">
        <tr>
            <td align="center">
                <font color="white">
                    © 2026 StoreVerse
                </font>
            </td>
        </tr>
    </table>
</body>
</html>
