<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoreVerse | Register</title>
</head>
<body bgcolor="#F4F8FC">
    <!-- Header -->
    <table width="100%" bgcolor="#1E3A8A" cellpadding="15">
        <tr>
            <td>
                <font color="white" size="6">
                    🛍 StoreVerse
                </font>
                <br>
                <font color="white">
                    One Platform. Unlimited Stores.
                </font>
            </td>
            <td align="right">
                <a href="index.html">Home</a>
                &nbsp;&nbsp;
                <a href="login.html">Login</a>
            </td>
        </tr>
    </table>
    <br><br>
    <center>
        <table bgcolor="white" cellpadding="25" width="550">
            <tr>
                <td>
                    <center>
                        <h2>Create Your Shop</h2>
                        <p>
                            Register your business and become a part of StoreVerse.
                        </p>
                    </center>
                    <hr>
                    <form action="#" method="post">
                        <label><b>Shop Owner Name</b></label>
                        <br><br>
                        <input
                            type="text"
                            name="ownername"
                            placeholder="Enter Full Name"
                            required
                            minlength="3"
                            maxlength="40"
                            size="55">
                        <br><br>
                        <label><b>Shop Name</b></label>
                        <br><br>
                        <input
                            type="text"
                            name="shopname"
                            placeholder="Enter Shop Name"
                            required
                            size="55">
                        <br><br>
                        <label><b>Username</b></label>
                        <br><br>
                        <input
                            type="text"
                            name="username"
                            required
                            minlength="5"
                            maxlength="20"
                            size="55">
                        <br><br>
                        <label><b>Email Address</b></label>
                        <br><br>
                        <input
                            type="email"
                            name="email"
                            placeholder="example@gmail.com"
                            required
                            size="55">
                        <br><br>
                        <label><b>Mobile Number</b></label>
                        <br><br>
                        <input
                            type="tel"
                            name="mobile"
                            pattern="[0-9]{10}"
                            placeholder="10 Digit Mobile Number"
                            required
                            size="55">
                        <br><br>
                        <label><b>Shop Category</b></label>
                        <br><br>
                        <select name="category" required>
                            <option value="">Select Category</option>
                            <option>Electronics</option>
                            <option>Fashion</option>
                            <option>Grocery</option>
                            <option>Pharmacy</option>
                            <option>Bakery</option>
                            <option>Restaurant</option>
                            <option>Books</option>
                            <option>Sports</option>
                            <option>Furniture</option>
                        </select>
                        <br><br>
                        <label><b>Business Address</b></label>
                        <br><br>
                        <textarea
                            rows="4"
                            cols="48"
                            required
                            placeholder="Enter Complete Shop Address"></textarea>
                        <br><br>
                        <label><b>Password</b></label>
                        <br><br>
                        <input
                            type="password"
                            name="password"
                            minlength="6"
                            required
                            size="55">
                        <br><br>
                        <label><b>Confirm Password</b></label>
                        <br><br>
                        <input
                            type="password"
                            name="confirmPassword"
                            minlength="6"
                            required
                            size="55">
                        <br><br>
                        <label>
                            <input
                                type="checkbox"
                                required>
                            I agree to the Terms and Conditions.
                        </label>
                        <br><br><br>
                        <center>
                            <input
                                type="submit"
                                value="Register Shop">
                            &nbsp;&nbsp;
                            <input
                                type="reset"
                                value="Clear Form">
                        </center>
                    </form>
                    <hr>
                    <center>
                        Already have an account?
                        <br><br>
                        <a href="login.html">
                            Login Here
                        </a>
                    </center>
                </td>
            </tr>
        </table>
    </center>
    <br><br>
    <table width="100%" bgcolor="#1E3A8A" cellpadding="20">
        <tr>
            <td align="center">
                <font color="white">
                    © 2026 StoreVerse. All Rights Reserved.
                </font>
            </td>
        </tr>
    </table>
</body>
</html>
